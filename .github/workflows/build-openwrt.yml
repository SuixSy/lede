name: Build ImmortalWrt-K3-21.02-Minimal
on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev gawk flex bison openssl libssl-dev dkms libelf-dev libudev-dev libpci-dev libiberty-dev autoconf automake curl wget unzip git swig texinfo

      - name: Update & Install feeds
        run: |
          ./scripts/feeds update base luci packages
          ./scripts/feeds install -p base -a
          ./scripts/feeds install -p luci luci-base luci-mod-admin-full luci-theme-bootstrap
          ./scripts/feeds install -p packages dnsmasq-full ppp ppp-mod-pppoe

      - name: Generate config & Clean
        run: |
          echo "CONFIG_TARGET_bcm53xx=y" > .config
          echo "CONFIG_TARGET_bcm53xx_DEVICE_phicomm_k3=y" >> .config
          echo "CONFIG_TARGET_BOARD=\"bcm53xx\"" >> .config
          echo "CONFIG_TARGET_SUBTARGET=\"generic\"" >> .config
          echo "CONFIG_TARGET_ROOTFS_EXT4FS=y" >> .config
          echo "# 基础系统" >> .config
          echo "CONFIG_PACKAGE_base-files=y" >> .config
          echo "CONFIG_PACKAGE_busybox=y" >> .config
          echo "CONFIG_PACKAGE_dropbear=y" >> .config
          echo "CONFIG_PACKAGE_firewall=y" >> .config
          echo "CONFIG_PACKAGE_iptables=y" >> .config
          echo "CONFIG_PACKAGE_opkg=y" >> .config
          echo "CONFIG_PACKAGE_ppp=y" >> .config
          echo "CONFIG_PACKAGE_ppp-mod-pppoe=y" >> .config
          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          echo "# LuCI最简后台" >> .config
          echo "CONFIG_PACKAGE_luci-base=y" >> .config
          echo "CONFIG_PACKAGE_luci-lib-ip=y" >> .config
          echo "CONFIG_PACKAGE_luci-lib-jsonc=y" >> .config
          echo "CONFIG_PACKAGE_luci-lib-nixio=y" >> .config
          echo "CONFIG_PACKAGE_luci-mod-admin-full=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
          echo "# K3无线驱动" >> .config
          echo "CONFIG_PACKAGE_kmod-brcmfmac=y" >> .config
          echo "# TUN for docker" >> .config
          echo "CONFIG_PACKAGE_kmod-tun=y" >> .config
          echo "# USB + EXT4 开启安全扩展" >> .config
          echo "CONFIG_PACKAGE_kmod-usb2=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-storage=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config
          echo "CONFIG_KERNEL_EXT4_FS_SECURITY=y" >> .config
          echo "# 禁用全部IPv6" >> .config
          echo "# CONFIG_PACKAGE_ip6tables is not set" >> .config
          echo "# CONFIG_PACKAGE_odhcp6c is not set" >> .config
          echo "# CONFIG_PACKAGE_odhcpd-ipv6only is not set" >> .config

          rm -rf ./build_dir ./staging_dir ./bin ./tmp
          touch .config.old

      - name: Compile firmware
        run: |
          export TERM=dumb
          make -j2 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-K3-21.02-Minimal
          path: bin/targets/bcm53xx/generic/*.trx
