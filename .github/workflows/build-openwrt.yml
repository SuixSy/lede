name: Build OpenWrt K3

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev gawk flex bison openssl libssl-dev dkms libelf-dev libudev-dev libpci-dev libiberty-dev autoconf automake curl wget unzip git swig texinfo

      - name: Update & Install feeds FIRST
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Download K3 config & Manual Clean
        run: |
          wget -O .config https://raw.githubusercontent.com/SuixSy/lede/master/k3.config
          rm -rf ./build_dir ./staging_dir ./bin ./tmp
          touch .config.old

      - name: Compile firmware
        run: |
          export TERM=dumb
          make -j1 V=s

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: K3‑Firmware
          path: bin/targets/bcm53xx/generic/*.trx
