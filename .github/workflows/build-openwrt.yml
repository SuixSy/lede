name: Build ImmortalWrt-K3-23.05
on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v5
        with:
          remove-dotnet: true
          remove-android: true
          remove-haskell: true

      - name: Clone ImmortalWrt openwrt-23.05
        run: git clone --depth=1 --branch=openwrt-23.05 https://github.com/immortalwrt/immortalwrt.git

      - name: Install build dependencies
        run: |
          cd immortalwrt
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev gawk flex bison openssl libssl-dev libelf-dev autoconf automake git wget curl unzip texinfo

      - name: Feeds update & install
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate K3 .config
        run: |
          cd immortalwrt
          rm -f .config
          # 基础目标平台
          echo "CONFIG_TARGET_bcm53xx=y" > .config
          echo "CONFIG_TARGET_DEVICE_bcm53xx_DEVICE_phicomm-k3=y" >> .config
          make defconfig

          # K3 无线驱动与固件
          echo "CONFIG_PACKAGE_kmod-brcmfmac=y" >> .config
          echo "CONFIG_PACKAGE_brcmfmac-firmware-43602a1-phicomm-k3=y" >> .config
          echo "CONFIG_PACKAGE_libiwinfo-lua=y" >> .config

          # Docker 需要内核选项
          echo "CONFIG_KERNEL_EXT4_FS_SECURITY=y" >> .config
          echo "CONFIG_KERNEL_EXT4_FS_POSIX_ACL=y" >> .config
          echo "CONFIG_KERNEL_CGROUPS=y" >> .config
          echo "CONFIG_KERNEL_MEMCG=y" >> .config
          echo "CONFIG_PACKAGE_kmod-tun=y" >> .config

          # LuCI网页管理
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-mod-admin-full=y" >> .config

          # USB / 存储
          echo "CONFIG_PACKAGE_kmod-usb2=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-storage=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config

          # 关闭 IPv6
          echo "# CONFIG_PACKAGE_ip6tables is not set" >> .config
          echo "# CONFIG_PACKAGE_odhcp6c is not set" >> .config
          echo "# CONFIG_PACKAGE_odhcpd-ipv6only is not set" >> .config

          # 再次defconfig同步配置，替换olddefconfig
          make defconfig

      - name: Download source packages
        run: |
          cd immortalwrt
          make download -j2

      - name: Compile firmware single thread
        run: |
          cd immortalwrt
          make V=s -j1 NO_CCACHE=1

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: K3-Firmware
          path: immortalwrt/bin/targets/bcm53xx/generic/
