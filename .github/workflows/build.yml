name: Build ImmortalWrt‑K3‑23.05.7
on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v5
        with:
          remove-dotnet: true
          remove-android: true
          remove-haskell: true

      - name: Clone ImmortalWrt 23.05 branch
        run: git clone --depth=1 --branch=openwrt-23.05 https://github.com/immortalwrt/immortalwrt.git

      - name: Install compile dependencies
        run: |
          cd immortalwrt
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison openssl libssl-dev libelf-dev autoconf automake git wget curl unzip swig texinfo

      - name: Feeds update & install packages
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate K3 custom kernel config
        run: |
          cd immortalwrt
          rm -f .config
          make defconfig
          echo "CONFIG_TARGET_bcm53xx=y" >> .config
          echo "CONFIG_TARGET_MULTI_PROFILE=y" >> .config
          echo "CONFIG_TARGET_DEVICE_bcm53xx_DEVICE_phicomm-k3=y" >> .config
          echo "CONFIG_KERNEL_EXT4_FS=y" >> .config
          echo "CONFIG_KERNEL_EXT4_FS_POSIX_ACL=y" >> .config
          echo "CONFIG_KERNEL_EXT4_FS_SECURITY=y" >> .config
          echo "CONFIG_KERNEL_CGROUPS=y" >> .config
          echo "CONFIG_KERNEL_CGROUP_CPUACCT=y" >> .config
          echo "CONFIG_KERNEL_CGROUP_DEVICE=y" >> .config
          echo "CONFIG_KERNEL_CGROUP_FREEZER=y" >> .config
          echo "CONFIG_KERNEL_CGROUP_PIDS=y" >> .config
          echo "CONFIG_KERNEL_BLK_CGROUP=y" >> .config
          echo "CONFIG_PACKAGE_kmod-tun=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          make oldconfig

      - name: Write built‑in USTC HTTP opkg source
        run: |
          cd immortalwrt
          cat > package/base-files/files/etc/opkg/distfeeds.conf <<'EOF'
src/gz immortalwrt_core http://mirrors.ustc.edu.cn/immortalwrt/releases/23.05.7/targets/bcm53xx/generic/packages
src/gz immortalwrt_base http://mirrors.ustc.edu.cn/immortalwrt/releases/23.05.7/packages/mipsle_74k/base
src/gz immortalwrt_luci http://mirrors.ustc.edu.cn/immortalwrt/releases/23.05.7/packages/mipsle_74k/luci
src/gz immortalwrt_packages http://mirrors.ustc.edu.cn/immortalwrt/releases/23.05.7/packages/mipsle_74k/packages
src/gz immortalwrt_routing http://mirrors.ustc.edu.cn/immortalwrt/releases/23.05.7/packages/mipsle_74k/routing
src/gz immortalwrt_telephony http://mirrors.ustc.edu.cn/immortalwrt/releases/23.05.7/packages/mipsle_74k/telephony
EOF

      - name: Download source packages
        run: |
          cd immortalwrt
          make download -j4

      - name: Start firmware compile
        run: |
          cd immortalwrt
          make V=s -j1 NO_CCACHE=1

      - name: Upload compiled firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: K3‑ImmortalWrt‑23.05.7‑Custom
          path: immortalwrt/bin/targets/bcm53xx/generic/
