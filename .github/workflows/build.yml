name: Build LEDE‑K3
on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu‑latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Packages
        run: |
          sudo apt‑get update
          sudo apt‑get install ‑y build‑essential libncurses‑dev gawk flex bison openssl libssl‑dev dkms libelf‑dev libudev‑dev libpci‑dev libiberty‑dev autoconf automake curl wget unzip git swig texinfo

      - name: Update Feeds
        run: |
          ./scripts/feeds update ‑a
          ./scripts/feeds install ‑a

      - name: K3 Config
        run: |
          rm ‑f .config
          cat > .config <<'EOC'
CONFIG_TARGET_bcm53xx=y
CONFIG_TARGET_MULTI_PROFILE=y
CONFIG_TARGET_DEVICE_bcm53xx_DEVICE_phicomm‑k3=y
CONFIG_BUILD_PATENTED=y
CONFIG_KERNEL_EXT4_FS=y
CONFIG_KERNEL_EXT4_FS_POSIX_ACL=y
CONFIG_KERNEL_EXT4_FS_SECURITY=y
CONFIG_KERNEL_CGROUPS=y
CONFIG_KERNEL_CGROUP_CPUACCT=y
CONFIG_KERNEL_CGROUP_DEVICE=y
CONFIG_KERNEL_CGROUP_FREEZER=y
CONFIG_KERNEL_CGROUP_PIDS=y
CONFIG_KERNEL_BLK_CGROUP=y
CONFIG_PACKAGE_kmod‑tun=y
CONFIG_PACKAGE_kmod‑fs‑ext4=y
CONFIG_PACKAGE_kmod‑fs‑ntfs3=y
CONFIG_PACKAGE_kmod‑fs‑f2fs=y
CONFIG_PACKAGE_kmod‑usb‑ohci=y
CONFIG_PACKAGE_kmod‑usb‑uhci=y
CONFIG_PACKAGE_kmod‑usb2=y
CONFIG_PACKAGE_kmod‑usb3=y
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci‑app‑dockerman=y
CONFIG_PACKAGE_dockerd=y
CONFIG_PACKAGE_luci‑app‑shellcrash=y
EOC
          make defconfig

      - name: Download
        run: make download ‑j8

      - name: Compile
        run: make V=s ‑j1

      - name: Upload Firmware
        uses: actions/upload‑artifact@v4
        with:
          name: K3‑Firmware
          path: bin/targets/bcm53xx/bcm53xx/
