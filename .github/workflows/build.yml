name: Build ImmortalWrt‑K3‑23.05.7
on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v5
        with:
          remove-dotnet: true
          remove-android: true
          remove-haskell: true

      - name: Clone ImmortalWrt 23.05 branch
        run: git clone --depth=1 --branch=openwrt-23.05 https://github.com/immortalwrt/immortalwrt.git

      - name: Install compile dependencies
        run: |
          cd immortalwrt
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison openssl libssl-dev libelf-dev autoconf automake git wget curl unzip texinfo

      - name: Feeds update & install packages
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load official bcm53xx default config & enable options
        run: |
          cd immortalwrt
          make defconfig CONFIG_TARGET=bcm53xx
          echo "CONFIG_KERNEL_EXT4_FS_SECURITY=y" >> .config
          echo "CONFIG_KERNEL_EXT4_FS_POSIX_ACL=y" >> .config
          echo "CONFIG_KERNEL_CGROUPS=y" >> .config
          echo "CONFIG_PACKAGE_kmod-tun=y" >> .config
          make oldconfig

      - name: Download source packages
        run: |
          cd immortalwrt
          make download -j4

      - name: Start firmware compile
        run: |
          cd immortalwrt
          make V=s -j1 NO_CCACHE=1

      - name: Upload compiled firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: K3‑ImmortalWrt‑23.05.7‑Custom
          path: immortalwrt/bin/targets/bcm53xx/generic/
