name: Build ImmortalWrt‑K3‑23.05.7
on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v5
        with:
          remove-dotnet: true
          remove-android: true
          remove-haskell: true

      - name: Clone ImmortalWrt 23.05 branch
        run: git clone --depth=1 --branch=openwrt-23.05 https://github.com/immortalwrt/immortalwrt.git

      - name: Install compile dependencies
        run: |
          cd immortalwrt
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison openssl libssl-dev libelf-dev autoconf automake git wget curl unzip swig texinfo

      - name: Feeds update & install packages
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate full K3 .config file
        run: |
          cd immortalwrt
          cat > .config <<'EOF'
CONFIG_TARGET_bcm53xx=y
CONFIG_TARGET_MULTI_PROFILE=y
CONFIG_TARGET_DEVICE_bcm53xx_DEVICE_phicomm-k3=y
CONFIG_TARGET_IMAGES_GZIP=y
CONFIG_TARGET_ROOTFS_SQUASHFS=y
CONFIG_KERNEL_EXT4_FS=y
CONFIG_KERNEL_EXT4_FS_POSIX_ACL=y
CONFIG_KERNEL_EXT4_FS_SECURITY=y
CONFIG_KERNEL_CGROUPS=y
CONFIG_KERNEL_CGROUP_CPUACCT=y
CONFIG_KERNEL_CGROUP_DEVICE=y
CONFIG_KERNEL_CGROUP_FREEZER=y
CONFIG_KERNEL_CGROUP_PIDS=y
CONFIG_KERNEL_BLK_CGROUP=y
CONFIG_PACKAGE_kmod-tun=y
CONFIG_PACKAGE_luci=y
EOF
          make oldconfig

      - name: Download source packages
        run: |
          cd immortalwrt
          make download -j4

      - name: Start firmware compile
        run: |
          cd immortalwrt
          make V=s -j1 NO_CCACHE=1

      - name: Upload compiled firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: K3‑ImmortalWrt‑23.05.7‑Custom
          path: immortalwrt/bin/targets/bcm53xx/generic/
